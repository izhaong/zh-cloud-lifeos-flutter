name: feature_productivity_drift
description: 提醒仓库的 Drift 持久化实现（kernel 端口实现包；无 UI、无同步）。
version: 0.1.0
publish_to: none
resolution: workspace

environment:
  sdk: ^3.12.2
  flutter: ">=3.32.0"

dependencies:
  flutter:
    sdk: flutter

  feature_productivity_kernel:
    path: ../feature_productivity_kernel

  drift: ^2.35.2
  drift_flutter: ^0.3.1
  path: any
  path_provider: ^2.1.6
  sqlite3: ">=3.4.0 <3.6.0"

  collection: any
  equatable: ^3.0.0
  meta: any
  uuid: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.7.1
  drift_dev: ^2.35.1
  flutter_lints: ^6.0.0
