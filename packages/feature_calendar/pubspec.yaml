name: feature_calendar
description: LifeOS 日历（Apple Calendar 对等；开源包，仅依赖 kernel，无 HTTP）。
version: 0.1.0
publish_to: none
resolution: workspace

environment:
  sdk: ^3.12.2
  flutter: ">=3.32.0"

dependencies:
  flutter:
    sdk: flutter

  feature_productivity_kernel:
    path: ../feature_productivity_kernel

  flutter_riverpod: ^3.4.3
  intl: any

  # 契约 §8.3（版本照抄）
  kalender: ^0.33.0
  table_calendar: ^3.3.0
  rrule: ^0.2.18
  timezone: ^0.11.2
  flutter_timezone: ^5.1.1
  enough_icalendar: ^0.17.0
  lunar: ^1.7.8
  cupertino_calendar_picker: ^2.2.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
