name: life_launcher
description: LifeOS 生活台壳（飞书式 Tab + 更多 + App Store 入口）
publish_to: none
version: 0.1.0+1
resolution: workspace

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  app_core:
    path: ../../packages/app_core
  life_link:
    path: ../../packages/life_link
  feature_productivity_kernel:
    path: ../../packages/feature_productivity_kernel
  feature_task:
    path: ../../packages/feature_task

  flutter_riverpod: ^3.4.3
  hooks_riverpod: ^3.4.3
  flutter_hooks: ^0.21.3+1
  go_router: ^18.1.1

  dio: ^5.11.1
  connectivity_plus: ^7.3.2
  flutter_secure_storage: ^11.2.0
  shared_preferences: ^2.5.6
  package_info_plus: ^10.2.2
  path_provider: ^2.1.6
  app_links: ^7.2.2
  url_launcher: ^6.3.3
  share_plus: ^13.3.1
  permission_handler: ^13.0.2
  file_picker: ^13.1.0
  image_picker: ^1.2.4

  drift: ^2.35.2
  drift_flutter: ^0.3.1
  flutter_local_notifications: ^22.3.2
  timezone: ^0.11.2
  table_calendar: ^3.2.1
  home_widget: ^0.10.0
  wakelock_plus: ^1.8.1

  cupertino_icons: ^1.0.8
  cached_network_image: ^3.4.1
  flutter_animate: ^4.5.2
  flutter_svg: ^2.3.0
  google_fonts: ^8.2.1
  material_symbols_icons: ^4.2960.0

  collection: any
  equatable: ^3.0.0
  intl: any
  json_annotation: ^4.12.0
  logger: ^2.8.0
  meta: any
  result_dart: ^2.2.0
  slang: ^4.19.2
  slang_flutter: ^4.19.0
  uuid: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
