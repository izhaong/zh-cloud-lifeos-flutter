name: zh_cloud_lifeos_flutter
description: LifeOS 个人生活开放平台（Flutter Melos 私有仓）
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.12.2

workspace:
  - apps/life_launcher
  - packages/app_core
  - packages/life_link
  - packages/feature_productivity_kernel
  - packages/feature_productivity_drift
  - packages/feature_task

dev_dependencies:
  melos: ^8.9.0
  flutter_lints: ^6.0.0

# Flutter 3.44 / Dart 3.12.2 与 sqlite3→hooks 传递依赖临时对齐；升级 Flutter 后删除
dependency_overrides:
  hooks: 2.0.0
