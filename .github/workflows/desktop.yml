name: Desktop

# 与 zh-cloud-todo-flutter desktop.yml 同构（GitHub = 非 Web 端构建打包平台）：
# Linux .deb / macOS .dmg / Windows Inno EXE / Android APK / iOS 未签名 IPA；
# v* tag 挂 GitHub Release。Web 端不在 GitHub 构建（另有部署线）。
# 差异（对 todo-flutter）：
# 1) Melos 多包：每端先 根 dart pub get + dart run melos bootstrap，构建在 apps/life_launcher。
# 2) 暂不做 WiX MSI 与 Sparkle appcast（lifeos 尚无自动更新器，接入时补）。
# 3) --dart-define 用 LIFEOS_*（M4 真同步接线时消费；当前 Noop 不读，先占位钉通道）。
#    test/prod 域名占位 service 车道，M4 域名定稿时在 metadata 段一处改。
# 权威仓库：https://github.com/izhaong/zh-cloud-lifeos-flutter

on:
  push:
    branches:
      - develop
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      build_env:
        description: "API 环境（test / prod）"
        required: true
        default: test
        type: choice
        options:
          - test
          - prod
      create_release:
        description: "是否创建 GitHub Release（手动触发时）"
        required: true
        default: "false"
        type: choice
        options:
          - "true"
          - "false"
      release_version:
        description: "正式发版版本号（prod + 创建 Release 时必填），如 0.1.0 → tag v0.1.0"
        required: false
        type: string

concurrency:
  group: desktop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  metadata:
    name: Resolve build env
    runs-on: ubuntu-latest
    outputs:
      build_env: ${{ steps.meta.outputs.build_env }}
      lifeos_api_base_url: ${{ steps.meta.outputs.lifeos_api_base_url }}
      lifeos_tenant_id: ${{ steps.meta.outputs.lifeos_tenant_id }}
      tag_name: ${{ steps.meta.outputs.tag_name }}
      create_release: ${{ steps.meta.outputs.create_release }}
    steps:
      - name: Compute metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF:-}" == refs/tags/v* ]]; then
            BUILD_ENV=prod
            API_BASE='https://zh-cloud-service.zh04.com'
            TAG_NAME="${GITHUB_REF#refs/tags/}"
            CREATE_RELEASE=true
          elif [[ "${GITHUB_REF:-}" == refs/heads/develop ]]; then
            BUILD_ENV=test
            API_BASE='https://zh-cloud-service-test.zh04.com'
            SHORT_SHA="$(echo "${GITHUB_SHA}" | cut -c1-7)"
            TAG_NAME="desktop-test-${SHORT_SHA}"
            CREATE_RELEASE=false
          else
            BUILD_ENV="${{ github.event.inputs.build_env || 'test' }}"
            if [[ "$BUILD_ENV" == prod ]]; then
              API_BASE='https://zh-cloud-service.zh04.com'
            else
              API_BASE='https://zh-cloud-service-test.zh04.com'
            fi
            SHORT_SHA="$(echo "${GITHUB_SHA}" | cut -c1-7)"
            CREATE_RELEASE="${{ github.event.inputs.create_release || 'false' }}"
            RELEASE_VERSION="${{ github.event.inputs.release_version || '' }}"
            RELEASE_VERSION="${RELEASE_VERSION#v}"
            if [[ "$CREATE_RELEASE" == "true" && "$BUILD_ENV" == "prod" ]]; then
              if [[ -z "$RELEASE_VERSION" ]]; then
                echo "prod 发版须填写 release_version（如 0.1.0）" >&2
                exit 1
              fi
              if [[ ! "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-.+)?$ ]]; then
                echo "release_version 须为 semver，如 0.1.0" >&2
                exit 1
              fi
              TAG_NAME="v${RELEASE_VERSION}"
            else
              TAG_NAME="desktop-${BUILD_ENV}-${SHORT_SHA}"
            fi
          fi
          echo "build_env=$BUILD_ENV" >> "$GITHUB_OUTPUT"
          echo "lifeos_api_base_url=$API_BASE" >> "$GITHUB_OUTPUT"
          echo "lifeos_tenant_id=1" >> "$GITHUB_OUTPUT"
          echo "tag_name=$TAG_NAME" >> "$GITHUB_OUTPUT"
          echo "create_release=$CREATE_RELEASE" >> "$GITHUB_OUTPUT"

  desktop-linux:
    name: Linux x64
    needs: metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev \
            libsecret-1-dev

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true

      - name: Build & package Linux desktop (.deb)
        env:
          LIFEOS_API_BASE_URL: ${{ needs.metadata.outputs.lifeos_api_base_url }}
          LIFEOS_TENANT_ID: ${{ needs.metadata.outputs.lifeos_tenant_id }}
        run: |
          set -euo pipefail
          OUT_DIR=".gha-dist/desktop"
          VERSION_LINE="$(grep '^version:' apps/life_launcher/pubspec.yaml | awk '{print $2}')"
          VERSION_NAME="${VERSION_LINE%%+*}"

          dart pub get
          dart run melos bootstrap
          cd apps/life_launcher
          if ! flutter build linux --release \
            --dart-define=LIFEOS_API_BASE_URL="${LIFEOS_API_BASE_URL}" \
            --dart-define=LIFEOS_TENANT_ID="${LIFEOS_TENANT_ID}" \
            > /tmp/linux-build.txt 2>&1; then
            echo "::group::flutter build linux 完整失败输出"
            cat /tmp/linux-build.txt
            echo "::endgroup::"
            mkdir -p ../../.gha-dist/logs
            cp /tmp/linux-build.txt ../../.gha-dist/logs/
            exit 1
          fi

          bundle="build/linux/x64/release/bundle"
          test -d "$bundle"
          cd ../..
          mkdir -p "$OUT_DIR"

          pkg_root=".gha-dist/deb-root"
          rm -rf "$pkg_root"
          mkdir -p "$pkg_root/DEBIAN"
          mkdir -p "$pkg_root/opt/lifeos-flutter"
          mkdir -p "$pkg_root/usr/share/applications"
          cp -a "apps/life_launcher/$bundle"/. "$pkg_root/opt/lifeos-flutter/"
          cp packaging/linux/life-launcher.desktop "$pkg_root/usr/share/applications/"
          printf '%s\n' \
            "Package: lifeos-flutter" \
            "Version: ${VERSION_NAME}" \
            "Section: utils" \
            "Priority: optional" \
            "Architecture: amd64" \
            "Maintainer: ZH Cloud <noreply@zh04.com>" \
            "Depends: libgtk-3-0, libblkid1, liblzma5" \
            "Description: LifeOS desktop client" \
            " ZH Cloud LifeOS (tasks and more) desktop application." \
            > "$pkg_root/DEBIAN/control"
          chmod 755 "$pkg_root/DEBIAN"
          dpkg-deb --root-owner-group --build "$pkg_root" \
            "${OUT_DIR}/lifeos-flutter-${VERSION_NAME}-x86_64.deb"
          test -s "${OUT_DIR}/lifeos-flutter-${VERSION_NAME}-x86_64.deb"
          ls -la "$OUT_DIR"

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: desktop-linux
          if-no-files-found: error
          path: .gha-dist/desktop/*x86_64.deb

      - name: 失败日志上翻为 artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-build-log
          path: .gha-dist/logs/
          if-no-files-found: ignore

  desktop-macos:
    name: macOS
    needs: metadata
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true

      - name: Build & package macOS desktop (.dmg)
        env:
          LIFEOS_API_BASE_URL: ${{ needs.metadata.outputs.lifeos_api_base_url }}
          LIFEOS_TENANT_ID: ${{ needs.metadata.outputs.lifeos_tenant_id }}
        run: |
          set -euo pipefail
          OUT_DIR=".gha-dist/desktop"
          VERSION_LINE="$(grep '^version:' apps/life_launcher/pubspec.yaml | awk '{print $2}')"
          VERSION_NAME="${VERSION_LINE%%+*}"

          dart pub get
          dart run melos bootstrap
          cd apps/life_launcher
          flutter build macos --release \
            --dart-define=LIFEOS_API_BASE_URL="${LIFEOS_API_BASE_URL}" \
            --dart-define=LIFEOS_TENANT_ID="${LIFEOS_TENANT_ID}"

          app="$(ls -d build/macos/Build/Products/Release/*.app | head -1)"
          test -d "$app"
          cd ../..
          mkdir -p "$OUT_DIR"

          arch="$(uname -m)"
          case "$arch" in
            arm64) arch_slug="aarch64" ;;
            x86_64) arch_slug="x86_64" ;;
            *) arch_slug="$arch" ;;
          esac
          dmg="${OUT_DIR}/lifeos-flutter-${VERSION_NAME}-${arch_slug}.dmg"
          hdiutil create -volname "LifeOS" -srcfolder "apps/life_launcher/$app" -ov -format UDZO "$dmg"
          test -s "$dmg"
          ls -la "$OUT_DIR"

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: desktop-macos
          if-no-files-found: error
          path: .gha-dist/desktop/*.dmg

  desktop-windows:
    name: Windows x64
    needs: metadata
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true

      - name: Install Windows packaging tools
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress

      - name: Build Flutter Windows app
        shell: pwsh
        env:
          LIFEOS_API_BASE_URL: ${{ needs.metadata.outputs.lifeos_api_base_url }}
          LIFEOS_TENANT_ID: ${{ needs.metadata.outputs.lifeos_tenant_id }}
        run: |
          $ErrorActionPreference = 'Stop'
          dart pub get
          dart run melos bootstrap
          Set-Location apps/life_launcher
          flutter config --enable-windows-desktop
          flutter build windows --release `
            --dart-define=LIFEOS_API_BASE_URL="$env:LIFEOS_API_BASE_URL" `
            --dart-define=LIFEOS_TENANT_ID="$env:LIFEOS_TENANT_ID"
          if (-not (Test-Path 'build/windows/x64/runner/Release')) {
            throw 'Flutter Windows build output missing'
          }

      - name: Package Windows EXE (Inno Setup)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $OUT_DIR = '.gha-dist/desktop'
          $VERSION_NAME = ((Select-String -Path apps/life_launcher/pubspec.yaml -Pattern '^version:' | Select-Object -First 1).Line.Split()[1]).Split('+')[0]
          New-Item -ItemType Directory -Force -Path $OUT_DIR | Out-Null
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) { throw "Inno Setup not found at $iscc" }
          & $iscc "/DAppVersion=$VERSION_NAME" "/Flifeos-flutter-$VERSION_NAME-x86_64" "/O$PWD/$OUT_DIR" 'packaging/windows/life_launcher.iss'
          $exe = Get-ChildItem "$OUT_DIR/*x86_64.exe" | Select-Object -First 1
          if (-not $exe -or $exe.Length -le 0) { throw 'EXE installer missing' }

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: desktop-windows
          if-no-files-found: error
          path: .gha-dist/desktop/*

  desktop-android:
    name: Android APK
    needs: metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.8"
          channel: stable
          cache: true

      - name: Optional release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            echo "未配置 ANDROID_KEYSTORE_BASE64，APK 使用 debug 签名，可以侧载，不能上架。"
            exit 0
          fi
          test -n "${ANDROID_KEYSTORE_PASSWORD:-}"
          test -n "${ANDROID_KEY_ALIAS:-}"
          test -n "${ANDROID_KEY_PASSWORD:-}"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > apps/life_launcher/android/app/ci-release.keystore
          printf '%s\n' \
            "storePassword=${ANDROID_KEYSTORE_PASSWORD}" \
            "keyPassword=${ANDROID_KEY_PASSWORD}" \
            "keyAlias=${ANDROID_KEY_ALIAS}" \
            "storeFile=ci-release.keystore" \
            > apps/life_launcher/android/key.properties

      - name: Build Android APK
        env:
          LIFEOS_API_BASE_URL: ${{ needs.metadata.outputs.lifeos_api_base_url }}
          LIFEOS_TENANT_ID: ${{ needs.metadata.outputs.lifeos_tenant_id }}
        run: |
          set -euo pipefail
          OUT_DIR=".gha-dist/desktop"
          VERSION_LINE="$(grep '^version:' apps/life_launcher/pubspec.yaml | awk '{print $2}')"
          VERSION_NAME="${VERSION_LINE%%+*}"
          dart pub get
          dart run melos bootstrap
          cd apps/life_launcher
          flutter build apk --release \
            --dart-define=LIFEOS_API_BASE_URL="${LIFEOS_API_BASE_URL}" \
            --dart-define=LIFEOS_TENANT_ID="${LIFEOS_TENANT_ID}"
          mkdir -p "../../$OUT_DIR"
          cp build/app/outputs/flutter-apk/app-release.apk \
            "../../$OUT_DIR/lifeos-flutter-${VERSION_NAME}-android.apk"
          test -s "../../$OUT_DIR/lifeos-flutter-${VERSION_NAME}-android.apk"

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: desktop-android
          if-no-files-found: error
          path: .gha-dist/desktop/*android.apk

  desktop-ios:
    name: iOS unsigned IPA
    needs: metadata
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.8"
          channel: stable
          cache: true

      - name: Build unsigned iOS app
        env:
          LIFEOS_API_BASE_URL: ${{ needs.metadata.outputs.lifeos_api_base_url }}
          LIFEOS_TENANT_ID: ${{ needs.metadata.outputs.lifeos_tenant_id }}
        run: |
          set -euo pipefail
          OUT_DIR=".gha-dist/desktop"
          VERSION_LINE="$(grep '^version:' apps/life_launcher/pubspec.yaml | awk '{print $2}')"
          VERSION_NAME="${VERSION_LINE%%+*}"
          dart pub get
          dart run melos bootstrap
          cd apps/life_launcher
          flutter build ios --release --no-codesign \
            --dart-define=LIFEOS_API_BASE_URL="${LIFEOS_API_BASE_URL}" \
            --dart-define=LIFEOS_TENANT_ID="${LIFEOS_TENANT_ID}"
          test -d build/ios/iphoneos/Runner.app
          rm -rf Payload
          mkdir Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          mkdir -p "../../$OUT_DIR"
          /usr/bin/zip -qry "../../$OUT_DIR/lifeos-flutter-${VERSION_NAME}-ios-unsigned.ipa" Payload
          test -s "../../$OUT_DIR/lifeos-flutter-${VERSION_NAME}-ios-unsigned.ipa"

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: desktop-ios
          if-no-files-found: error
          path: .gha-dist/desktop/*ios-unsigned.ipa

  release:
    name: GitHub Release
    needs:
      - metadata
      - desktop-linux
      - desktop-macos
      - desktop-windows
      - desktop-android
      - desktop-ios
    if: needs.metadata.outputs.create_release == 'true' && !cancelled() && needs.desktop-linux.result == 'success' && needs.desktop-macos.result == 'success' && needs.desktop-windows.result == 'success' && needs.desktop-android.result == 'success' && needs.desktop-ios.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: desktop-linux
          path: dist/desktop

      - uses: actions/download-artifact@v4
        with:
          name: desktop-macos
          path: dist/desktop

      - uses: actions/download-artifact@v4
        with:
          name: desktop-windows
          path: dist/desktop
        continue-on-error: true

      - uses: actions/download-artifact@v4
        with:
          name: desktop-android
          path: dist/desktop

      - uses: actions/download-artifact@v4
        with:
          name: desktop-ios
          path: dist/desktop

      - run: ls -la dist/desktop/

      - name: Write release notes
        run: |
          set -euo pipefail
          VERSION="$(grep '^version:' apps/life_launcher/pubspec.yaml | awk '{print $2}' | cut -d+ -f1)"
          TAG="${{ needs.metadata.outputs.tag_name }}"
          BASE="https://github.com/izhaong/zh-cloud-lifeos-flutter/releases/download/${TAG}"
          printf '%s\n' \
            "| Architecture | Windows | Ubuntu | Mac | Android | iOS |" \
            "| --- | --- | --- | --- | --- | --- |" \
            "| x86-64 (64-bit) | [EXE](${BASE}/lifeos-flutter-${VERSION}-x86_64.exe) | [Download](${BASE}/lifeos-flutter-${VERSION}-x86_64.deb) | | [APK](${BASE}/lifeos-flutter-${VERSION}-android.apk) | |" \
            "| AArch64 (ARM64) | | | [Download](${BASE}/lifeos-flutter-${VERSION}-aarch64.dmg) | | [未签名 IPA](${BASE}/lifeos-flutter-${VERSION}-ios-unsigned.ipa) |" \
            "" \
            "LifeOS 生活台（任务 / 日历 / 习惯）多端客户端。iOS 包未签名，不能直接安装；Android 未配置发布密钥时为 debug 签名，可侧载。" \
            > RELEASE_BODY.md

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.metadata.outputs.tag_name }}
          name: LifeOS ${{ needs.metadata.outputs.tag_name }}
          prerelease: ${{ needs.metadata.outputs.build_env != 'prod' }}
          generate_release_notes: false
          body_path: RELEASE_BODY.md
          files: dist/desktop/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
