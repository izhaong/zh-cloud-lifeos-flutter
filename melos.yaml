name: zh_cloud_lifeos_flutter
repository: https://gitea.zh04.com/izhaong/zh-cloud-lifeos-flutter

packages:
  - apps/**
  - packages/**

command:
  bootstrap:
    environment:
      sdk: ">=3.12.0 <4.0.0"

scripts:
  analyze:
    run: melos exec -- flutter analyze --fatal-infos
    description: 全仓静态分析
  test:
    run: melos exec --dir-exists=test -- flutter test
    description: 全仓单元/Widget 测试
  get:
    run: dart pub get
    description: 根 workspace 拉依赖
  gen:
    run: melos exec --depends-on=build_runner -- dart run build_runner build --delete-conflicting-outputs
    description: freezed / drift / riverpod_generator 代码生成
